name: E2E

# The real app (production build) in Chromium against a local Supabase
# stand-in: PostgreSQL 16 with the real schema/RLS, PostgREST, and a small
# gateway (tests/e2e/gateway.mjs) for Auth + Storage. See tests/e2e/run.sh.
on:
  pull_request:
  workflow_dispatch:

# Least privilege: the job only reads the repo.
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # ubuntu-24.04 ships the PostgreSQL 16 server binaries (initdb/pg_ctl).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/e2e/package-lock.json
      - run: npm ci
      # Harness-only dependencies (Playwright, pg) live in tests/e2e.
      - run: npm ci --no-audit --no-fund
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: npm run test:e2e
        env:
          E2E_TMP: ${{ runner.temp }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts
          path: tests/e2e/artifacts/
          retention-days: 14
          if-no-files-found: ignore
